# This file is part of Eisenberg Family Depression Center Open Source Hub (DepressionCenter.github.io repository).
# build-site.yml - Rebuild the static site from the GitHub API and commit the result.
# Author(s): Gabriel Mongefranco.
# Created: 2026-09-01
# Last Modified: 2026-09-01
# Summary: Runs scripts/build_site.py once a night and after template or style changes, then
#          commits the generated pages so GitHub Pages serves finished HTML.
# Notes: See README file for documentation and full license information.
# Website: https://code.depressioncenter.org/
#
# Copyright (c) 2026 The Regents of the University of Michigan
# Licensed under the GNU General Public License v3.0 or later.
# See <https://www.gnu.org/licenses/>.
name: Build site

on:
  # 07:30 UTC is 03:30 in Michigan during daylight saving time and 02:30 otherwise.
  schedule:
    - cron: '30 7 * * *'
  # Rebuild when the source of the site changes, but never in response to the workflow's own
  # commit. Pushes made with GITHUB_TOKEN do not start workflows, and these paths hold only
  # generated files, so a rebuild cannot trigger another rebuild.
  push:
    branches: [main]
    paths-ignore:
      - 'index.html'
      - 'repos/**'
      - 'data/readme/**'
      - 'data/repos.json'
      - 'data/build-cache.json'
      - 'images/repo-previews/remote/**'
      - 'sitemap.xml'
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    # Forks have no reason to publish to this repository and cannot push to it.
    if: github.repository == 'DepressionCenter/DepressionCenter.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Build the site
        # The token is issued automatically for this run and only raises the API rate limit
        # from 60 to 1000 requests an hour. No secret needs to be created or stored.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_site.py

      - name: Commit the generated files
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No content changed; nothing to publish."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild site from the GitHub API"
          git push
