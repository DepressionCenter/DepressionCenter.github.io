<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
{{HEAD_META}}
{{JSONLD}}

  <!-- Google tag (gtag.js) — only loads on depressioncenter.org and umich.edu domains -->
  <script>
    (function () {
      var host = window.location.hostname;
      if (/(?:^|\.)(?:depressioncenter\.org|umich\.edu)$/.test(host)) {
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-3Q455XWS5F';
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { dataLayer.push(arguments); };
        gtag('js', new Date());
        gtag('config', 'G-3Q455XWS5F');
      }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Serif+Display:ital@0;1&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../../styles/site.css" />
</head>
<body>
{{SITE_HEADER}}

  <!-- MAIN CONTENT -->
  <main id="main-content" class="detail-main">
    <nav class="detail-breadcrumb" aria-label="Breadcrumb">
      <a href="../../">Open Source Hub</a>
      <span aria-hidden="true">/</span>
      <span aria-current="page">{{REPO_NAME}}</span>
    </nav>

    <article class="detail-article">
      <p class="section-label" aria-hidden="true">// repository</p>
      <h1 class="detail-title">{{REPO_NAME}}</h1>
      <p class="detail-description">{{DESCRIPTION}}</p>

{{PREVIEW}}
{{LAB}}
      <div class="repo-links">{{LINKS}}</div>
      <div class="repo-meta detail-meta">{{TAGS}}</div>

      <section class="panel-readme detail-readme" aria-labelledby="readme-heading">
        <h2 id="readme-heading" class="sr-only">Documentation from the repository README</h2>
{{README_HTML}}
      </section>

      <div class="repo-links panel-links-bottom">{{LINKS}}</div>
    </article>

    <p class="detail-back"><a href="../../">&larr; Back to all repositories</a></p>
  </main>

{{SITE_FOOTER}}
</body>
</html>
